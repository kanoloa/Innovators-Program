name: MazdaInnovatorsProgram
on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

    - name: Check out repository code
      uses: actions/checkout@v6

    - name: Clean up old reports
      run: |
        rm -f report.zip

    - name: zip report file
      run: |
        cd tests
        zip ../report.zip report.xml
        cd ../
        ls -al

    - name: upload test result
      run: >
        curl -F 'configuration={
        "testConfigurationId":"1031813",
        "testCaseTrackerId":"170543",
        "testCaseId":"1031815",
        "releaseId":"",
        "testRunTrackerId":"170552",
        "buildIdentifier":"Build123",
        "defaultPackagePrefix":""}'
        -F 'file=@report.zip'
        https://pp-2608070745qj.portal.ptc.io:9443/cb/rest/xunitresults/
        -u myne:myne
    - name: complete
      run: echo "upload completed."
